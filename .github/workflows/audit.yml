name: I-130 Mandamus Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'run-meta/**'

concurrency:
  group: i130-mandamus-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  audit-maryland:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COURTLISTENER_API_KEY: ${{ secrets.COURTLISTENER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify CourtListener secret
        run: test -n "$COURTLISTENER_API_KEY"
      - name: Audit at most 10 recent Maryland dockets
        run: python -u rate_limited_runner.py --cohort maryland_primary --max-pages 2 --max-dockets 10 --max-documents-per-docket 15 --output output/maryland
      - name: Upload Maryland checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i130-mandamus-audit-maryland
          path: output/maryland/
          if-no-files-found: warn
          retention-days: 30

  audit-canada:
    needs: audit-maryland
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COURTLISTENER_API_KEY: ${{ secrets.COURTLISTENER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Audit at most 5 Canada-control dockets
        run: python -u rate_limited_runner.py --cohort canada_control --max-pages 1 --max-dockets 5 --max-documents-per-docket 15 --output output/canada
      - name: Upload Canada checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i130-mandamus-audit-canada
          path: output/canada/
          if-no-files-found: warn
          retention-days: 30

  metadata:
    if: always()
    needs: [tests, audit-maryland, audit-canada]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish run metadata
        run: |
          mkdir -p run-meta
          cat > run-meta/latest.json <<EOF
          {
            "run_id": ${{ github.run_id }},
            "head_sha": "${{ github.sha }}",
            "tests": "${{ needs.tests.result }}",
            "maryland": "${{ needs.audit-maryland.result }}",
            "canada": "${{ needs.audit-canada.result }}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run-meta/latest.json
          git commit -m "Record latest audit workflow run [skip ci]" || exit 0
          git push
