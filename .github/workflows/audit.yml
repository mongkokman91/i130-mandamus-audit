name: I-130 Mandamus Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'run-meta/**'

concurrency:
  group: i130-mandamus-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  audit-maryland:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cohort: [md_2016_2018, md_2019_2021, md_2022_2023, md_2024_2025, md_2026]
    env:
      COURTLISTENER_API_KEY: ${{ secrets.COURTLISTENER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify CourtListener secret
        run: test -n "$COURTLISTENER_API_KEY"
      - name: Audit complete Maryland date shard
        run: >-
          python -u rate_limited_runner.py
          --config maryland_census.yaml
          --cohort ${{ matrix.cohort }}
          --max-pages 50
          --max-dockets 0
          --max-documents-per-docket 0
          --output output/${{ matrix.cohort }}
      - name: Upload shard checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: md-shard-${{ matrix.cohort }}
          path: output/${{ matrix.cohort }}/
          if-no-files-found: warn
          retention-days: 90

  merge-maryland:
    if: always()
    needs: [tests, audit-maryland]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: md-shard-*
          path: shards
      - name: Merge and validate every shard
        run: >-
          python merge_outputs.py
          --input-root shards
          --output output/combined
          --expected-shards md_2016_2018 md_2019_2021 md_2022_2023 md_2024_2025 md_2026
      - name: Upload decision-grade census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i130-mandamus-audit-results
          path: output/combined/
          if-no-files-found: error
          retention-days: 90

  metadata:
    if: always()
    needs: [tests, audit-maryland, merge-maryland]
    runs-on: ubuntu-latest
    steps:
      - name: Create run metadata
        run: |
          mkdir -p run-meta
          cat > run-meta/latest.json <<EOF
          {
            "run_id": ${{ github.run_id }},
            "head_sha": "${{ github.sha }}",
            "tests": "${{ needs.tests.result }}",
            "maryland_shards": "${{ needs.audit-maryland.result }}",
            "merge_validation": "${{ needs.merge-maryland.result }}"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: audit-run-metadata
          path: run-meta/latest.json
          if-no-files-found: error
          retention-days: 90
