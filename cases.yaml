version: 8
research_scope:
  benefit: "Form I-130"
  focus: "pending spousal I-130 / APA / mandamus unreasonable-delay litigation"
  target_delay_months: [12, 18]
  primary_venue_hypothesis: "D. Maryland"
  service_center_hypothesis: "Potomac / YSC"
  outcome_labels: [CONFIRMED_FAVORABLE, PROBABLE_FAVORABLE, CONFIRMED_ADVERSE, PENDING, UNKNOWN]

lawyers: []

# Focused, staged cohort: Maryland comparators first, then a small nationwide
# Potomac/YSC and foreign-resident control. Every discovered docket is fully
# audited after deduplication.
discovery_queries:
  # Primary D. Maryland spousal/family I-130 cohort
  - {filed_after: "2023-08-21", court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: '"I-130"'}
  - {filed_after: "2023-08-21", court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: '"Petition for Alien Relative"'}
  - {filed_after: "2023-08-21", court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: '"I-130" Potomac'}
  - {filed_after: "2023-08-21", court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: '"I-130" YSC'}
  - {filed_after: "2023-08-21", court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: '"I-130" "voluntary dismissal"'}
  - {filed_after: "2023-08-21", court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: '"I-130" approved adjudicated'}
  - {filed_after: "2023-08-21", court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: '"I-130" venue transfer'}

  # Small nationwide Potomac/YSC control
  - {filed_after: "2019-01-01", q: '"I-130" Potomac mandamus'}
  - {filed_after: "2019-01-01", q: '"I-130" YSC mandamus'}
  - {filed_after: "2019-01-01", q: '"Petition for Alien Relative" Potomac mandamus'}

  # Foreign-resident venue comparators
  - {filed_after: "2019-01-01", q: '"I-130" Canada mandamus'}
  - {filed_after: "2019-01-01", q: '"I-130" "resides in Canada" mandamus'}
  - {filed_after: "2019-01-01", q: '"I-130" "resides outside the United States" mandamus'}

evidence_patterns:
  spouse: ["husband", "wife", "spouse", "marriage", "married"]
  i130: ["i-130", "i130", "petition for alien relative"]
  pending: ["remains pending", "still pending", "has been pending", "pending with uscis"]
  approval: ["i-130 was approved", "i-130 has been approved", "petition was approved", "petition has been approved", "uscis approved"]
  adjudication: ["uscis adjudicated", "petition was adjudicated", "petition has been adjudicated", "agency adjudicated"]
  voluntary_dismissal: ["voluntary dismissal", "notice of dismissal", "stipulation of dismissal", "stipulated dismissal"]
  adverse: ["motion to dismiss granted", "case dismissed with prejudice", "petition denied", "complaint dismissed"]
  service_centers: ["potomac", "ysc", "nebraska", "lin", "texas", "src", "vermont", "eac", "california", "wac", "national benefits center", "msc"]

