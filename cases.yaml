version: 5
research_scope:
  benefit: "Form I-130"
  focus: "pending spousal I-130 / APA / mandamus unreasonable-delay litigation"
  target_delay_months: [12, 18]
  primary_venue_hypothesis: "D. Maryland"
  service_center_hypothesis: "Potomac / YSC"
  outcome_labels: [CONFIRMED_FAVORABLE, PROBABLE_FAVORABLE, CONFIRMED_ADVERSE, PENDING, UNKNOWN]

lawyers:
  - name: "Hashim G. Jeelani"
    search_params: {atty_name: "Hashim G. Jeelani", q: "I-130"}
  - name: "Arif Gozel"
    search_params: {atty_name: "Arif Gozel", q: "I-130"}
  - name: "Benjamin G. Messer"
    search_params: {atty_name: "Benjamin G. Messer", q: "I-130"}
  - name: "Carley Tatman"
    search_params: {atty_name: "Carley Tatman", q: "I-130"}

# Primary cohort: D. Maryland. These searches measure local filing experience,
# comparable I-130/Potomac cases, dispositions, and venue-transfer problems.
primary_discovery_queries:
  - {court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: "I-130"}
  - {court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: "Potomac"}
  - {court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: "YSC"}
  - {court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: '"Voluntary Dismissal"'}
  - {court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: "approved adjudicated"}
  - {court: "mdd", nature_of_suit: "465 Other Immigration Actions", cause: "Petition for Writ of Mandamus", q: "venue transfer"}

# Nationwide control cohort: find where Potomac/YSC I-130 mandamus cases are
# actually filed, including possible foreign-resident plaintiffs.
control_discovery_queries:
  - {q: '"I-130" Potomac mandamus'}
  - {q: '"I-130" YSC mandamus'}
  - {q: '"Petition for Alien Relative" Potomac mandamus'}
  - {q: '"I-130" Canada mandamus'}
  - {q: '"I-130" "resides in Canada" mandamus'}
  - {q: '"I-130" "resides outside the United States" mandamus'}

# Legacy broad discovery remains as a secondary catch-all.
discovery_queries:
  - {q: "I-130 mandamus"}
  - {q: '"I-130" "writ of mandamus"'}
  - {q: '"I-130" "unreasonable delay"'}
  - {q: '"Petition for Alien Relative" mandamus'}
  - {q: '"I-130" USCIS mandamus'}

evidence_patterns:
  spouse: ["husband", "wife", "spouse", "marriage", "married"]
  i130: ["i-130", "i130", "petition for alien relative"]
  pending: ["remains pending", "still pending", "has been pending", "pending with uscis"]
  approval: ["i-130 was approved", "i-130 has been approved", "petition was approved", "petition has been approved", "uscis approved"]
  adjudication: ["uscis adjudicated", "petition was adjudicated", "petition has been adjudicated", "agency adjudicated"]
  voluntary_dismissal: ["voluntary dismissal", "notice of dismissal", "stipulation of dismissal", "stipulated dismissal"]
  adverse: ["motion to dismiss granted", "case dismissed with prejudice", "petition denied", "complaint dismissed"]
  service_centers: ["potomac", "ysc", "nebraska", "lin", "texas", "src", "vermont", "eac", "california", "wac", "national benefits center", "msc"]

seed_cases:
